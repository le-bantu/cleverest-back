name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cleverest
          POSTGRES_PASSWORD: cleverest
          POSTGRES_DB: cleverest_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cleverest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cleverest:cleverest@localhost:5433/cleverest_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_ACCESS_TTL: 900s
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_REFRESH_TTL: 30d

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - run: npm run prisma:deploy
      - run: npm run test:integration
      - run: npm run test:e2e
