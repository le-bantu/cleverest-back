name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cleverest
          POSTGRES_PASSWORD: cleverest
          POSTGRES_DB: cleverest_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cleverest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cleverest:cleverest@localhost:5433/cleverest_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_ACCESS_TTL: 900s
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_REFRESH_TTL: 30d

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run build
      - run: npm run test:cov
      - run: npm run prisma:deploy
      - run: npm run test:integration
      - run: npm run test:e2e
      - name: Export the OpenAPI contract
        run: npm run openapi:export -- openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
          if-no-files-found: error
      # critical only: the remaining `high` advisories are in the Prisma CLI (see docs, security review)
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"
      - name: Log in to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
