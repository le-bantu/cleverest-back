services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: cleverest-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: cleverest
      POSTGRES_PASSWORD: cleverest
      POSTGRES_DB: cleverest
    ports:
      # Host 5442 -> container 5432. Plan default is 5432, but this workstation
      # already runs a local postgresql@14 service on 5432. Test DB keeps 5433.
      - '5442:5432'
    volumes:
      - cleverest-pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cleverest']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    container_name: cleverest-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: cleverest
      POSTGRES_PASSWORD: cleverest
      POSTGRES_DB: cleverest_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cleverest']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cleverest-pgdata-dev:
